<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>长安城知识卡片组件</title>
  <style>
    :root{--bg:#07170d;--deep:#06261a;--mid:#0b3526;--gold:#c99b45;--gold2:#98702f;--paper:#dfc784;--mist:#9aaa94}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px;color:var(--paper);font-family:FangSong,STFangsong,"Songti SC",serif;background:radial-gradient(ellipse at 50% 36%,#143321 0%,var(--bg) 56%)}
    header{max-width:980px;margin:auto;display:flex;justify-content:space-between;align-items:end;gap:18px}.kicker{color:var(--gold);letter-spacing:.25em;font-size:13px}h1{margin:6px 0 0;font:400 31px STKaiti,KaiTi,"Kaiti SC",serif;color:var(--gold);letter-spacing:.13em}.small{font-size:13px;color:var(--mist)}
    .types{max-width:980px;margin:22px auto;display:flex;gap:9px;justify-content:center;flex-wrap:wrap}button{font:inherit;color:var(--paper);background:#0c2b1d;border:1px solid #c99b4555;border-radius:999px;padding:9px 15px;cursor:pointer}button.active{background:var(--gold);color:#07170d}
    .layout{max-width:980px;margin:auto;display:grid;grid-template-columns:minmax(300px,390px) minmax(280px,420px);gap:38px;justify-content:center;align-items:center}.scene{perspective:1600px}.card{height:660px;position:relative;transform-style:preserve-3d;transition:transform .7s}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:29px;overflow:hidden;padding:26px;background:radial-gradient(circle at 80% 10%,#31564345,transparent 27%),linear-gradient(180deg,var(--deep),var(--mid) 52%,#3c4930 78%,#a77b3d 120%);box-shadow:0 28px 70px #0009,inset 0 0 0 1px #c99b4545}.face:after{content:"";position:absolute;inset:0;opacity:.14;pointer-events:none;background-image:radial-gradient(circle at 15% 20%,transparent 0 6px,#c99b45 7px 8px,transparent 9px);background-size:97px 83px}.back{transform:rotateY(180deg)}.layer{position:relative;z-index:1}.top{display:flex;justify-content:space-between;font-size:12px}.type{color:var(--gold);letter-spacing:.17em}.id{color:var(--mist);font-family:monospace}.title{margin:18px 0 14px}.pinyin{font-size:12px;color:var(--gold2);letter-spacing:.32em}.name{font:400 51px/1.2 STKaiti,KaiTi,"Kaiti SC",serif;color:var(--gold);letter-spacing:.1em;text-shadow:0 5px 12px #0008}.subtitle{font-size:13px;letter-spacing:.1em}
    .visual{height:350px;margin:15px -26px 13px;position:relative;overflow:hidden;border-block:1px solid #c99b4538;background:radial-gradient(circle at 50% 58%,#b18b4935,transparent 44%),linear-gradient(155deg,#0e3a29,#09261a 72%)}.visual img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;object-position:50% 53%;filter:saturate(.72) sepia(.15) contrast(1.05) brightness(.8)}.visual img.transparent-art{object-fit:contain;padding:12px 8px 23px;filter:saturate(.82) sepia(.08) contrast(1.04) brightness(.92);filter:drop-shadow(0 15px 15px #0008)}.visual:after{content:"";position:absolute;z-index:1;inset:0;background:linear-gradient(#06261a55,transparent 22%,transparent 68%,#112d1eaa);pointer-events:none}.placeholder{height:100%;display:grid;place-items:center;background:radial-gradient(circle,#c99b4530,transparent 43%),linear-gradient(145deg,#0d3d2b,#09271b)}.placeholder span{font:400 120px STKaiti,KaiTi,serif;color:var(--gold);opacity:.82;text-shadow:0 9px 20px #000}.note{position:absolute;z-index:2;right:15px;bottom:13px;padding:5px 8px;background:#05150dad;font-size:11px;border-left:1px solid var(--gold)}.summary{line-height:1.75;margin:0}.foot{position:absolute;z-index:2;bottom:24px;left:26px;right:26px;display:flex;justify-content:space-between;align-items:end}.period{color:var(--gold);letter-spacing:.15em}.seal{display:grid;place-items:center;width:46px;height:46px;border:1px solid var(--gold);font:400 24px STKaiti,KaiTi,serif;color:var(--gold)}
    .back-title{text-align:center;margin:33px 0 20px;font:400 24px STKaiti,KaiTi,serif;color:var(--gold);letter-spacing:.12em}.symbol{width:94px;height:94px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;margin:0 auto 23px;font:400 35px STKaiti,KaiTi,serif;color:var(--gold)}.facts{display:grid;gap:12px}.row{display:grid;grid-template-columns:68px 1fr;gap:12px;padding-bottom:10px;border-bottom:1px solid #c99b453d}.label{color:var(--gold2)}.evidence{margin-top:19px;padding:14px;background:#04130c88;border-left:2px solid var(--gold);line-height:1.7;font-size:14px}.etag{font-size:12px;color:var(--gold);letter-spacing:.08em}.source{font-size:12px;color:var(--mist)}
    .details h2{font:400 29px STKaiti,KaiTi,serif;color:var(--gold);margin:0 0 10px}.details p{line-height:1.8}.details ul{padding-left:1.2em;color:var(--mist);line-height:1.9}.actions{display:flex;gap:9px;margin-top:20px}.primary{background:var(--gold);color:#07170d}.status{margin-top:14px;min-height:24px;color:var(--gold)}
    @media(max-width:760px){body{padding:18px}header{display:block}.layout{grid-template-columns:minmax(290px,390px)}.details{text-align:center}.actions{justify-content:center}}
    @media(prefers-reduced-motion:reduce){.card{transition:none}}
  </style>
</head>
<body>
  <header><div><div class="kicker">长安城 · 知识图鉴组件</div><h1>多实体卡片原型</h1></div><div class="small">数据驱动 · 正反双面 · 知识库接口预留</div></header>
  <nav class="types" id="types" aria-label="实体类型"></nav>
  <main class="layout">
    <div class="scene"><div class="card" id="card"><article class="face front" id="front"></article><article class="face back" id="back"></article></div></div>
    <section class="details"><h2 id="detailName"></h2><p id="detailSummary"></p><ul><li>点击卡牌或“翻到背面”查看知识关系和证据。</li><li>切换实体类型时，版式不变，内容由数据配置驱动。</li><li>正式接入后把示例数组替换为知识卡片 API 返回值。</li></ul><div class="actions"><button class="primary" id="flip">翻到背面</button><button id="explore">在地图中定位</button></div><div class="status" id="status" aria-live="polite"></div></section>
  </main>
  <script src="cards-data.js"></script>
  <script>
    const cards=window.CHANGAN_KNOWLEDGE_CARDS,cardEl=document.getElementById('card'),front=document.getElementById('front'),back=document.getElementById('back'),types=document.getElementById('types'),status=document.getElementById('status');let selected=cards[0];
    const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function render(){cardEl.classList.remove('flipped');document.getElementById('flip').textContent='翻到背面';types.innerHTML=cards.map(c=>`<button data-id="${c.id}" class="${c.id===selected.id?'active':''}">${c.typeLabel}</button>`).join('');
      const visual=selected.image?`<img class="${selected.transparentImage?'transparent-art':''}" src="${selected.image}" alt="${escapeHtml(selected.name)}视觉参考" style="object-position:${selected.imagePosition||'50% 53%'}"><div class="note">${escapeHtml(selected.imageNote)}</div>`:`<div class="placeholder"><span>${escapeHtml(selected.symbol)}</span></div>`;
      front.innerHTML=`<div class="layer top"><span class="type">${selected.typeLabel} · ${selected.typeEn}</span><span class="id">${selected.id}</span></div><div class="layer title"><div class="pinyin">${selected.pinyin}</div><div class="name">${selected.name}</div><div class="subtitle">${selected.subtitle}</div></div><div class="layer visual">${visual}</div><p class="layer summary">${selected.summary}</p><div class="foot"><div><div class="period">${selected.period}</div><div class="small">长安城知识图鉴</div></div><div class="seal">${selected.symbol}</div></div>`;
      back.innerHTML=`<div class="layer top"><span class="type">知识与证据</span><span class="id">${selected.id}</span></div><div class="layer back-title">${selected.subtitle}</div><div class="layer symbol">${selected.symbol}</div><div class="layer facts">${selected.facts.map(f=>`<div class="row"><span class="label">${f[0]}</span><span>${f[1]}</span></div>`).join('')}</div><div class="layer evidence"><div class="etag">${selected.evidenceType}</div><div>${selected.quote}</div><div class="source">${selected.source}</div></div>`;
      document.getElementById('detailName').textContent=selected.name;document.getElementById('detailSummary').textContent=selected.summary;status.textContent='';
    }
    types.addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(!b)return;selected=cards.find(c=>c.id===b.dataset.id);render()});
    function flip(){const value=!cardEl.classList.contains('flipped');cardEl.classList.toggle('flipped',value);document.getElementById('flip').textContent=value?'返回正面':'翻到背面'}
    cardEl.addEventListener('click',flip);document.getElementById('flip').addEventListener('click',flip);document.getElementById('explore').addEventListener('click',()=>status.textContent=`地图交互预留：定位并高亮 ${selected.name}（${selected.id}）`);render();
  </script>
</body>
</html>
